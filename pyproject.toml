[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cochem-bench"
version = "0.1.0"
description = "CoChem-BENCH: Complete Basis Set (CBS) Extrapolation and High-Level Quantum Benchmarking"
authors = [{ name = "CoChem Development Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "h5py"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cochem_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
